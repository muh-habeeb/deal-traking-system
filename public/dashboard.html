<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swoop Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h1 style="margin: 0;">Deal Tracker Dashboard</h1>
      <button id="logoutBtn" class="secondary" style="max-width: 120px;">Logout</button>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Receiver Email</h2>
        <form id="emailForm">
          <label for="receiverEmail">Alerts Receiver</label>
          <input id="receiverEmail" type="email" placeholder="you@example.com" required />
          <button type="submit" style="margin-top: 10px;">Save Email</button>
        </form>
        <button id="sendTestEmailBtn" class="secondary" style="margin-top: 10px;">Send Test Email</button>
        <div id="emailNotice" class="notice"></div>
      </section>

      <section class="card">
        <h2>Facebook Session</h2>
        <div id="sessionStatus" class="notice">Checking...</div>
        <p class="small">Use Start Facebook Login, complete login in the opened browser, then click Save Session.</p>
        <div class="row" style="margin-top: 10px;">
          <button id="startSessionBtn">Start Facebook Login</button>
          <button id="saveSessionBtn" class="secondary">Save Session</button>
        </div>
        <div class="row" style="margin-top: 10px;">
          <button id="refreshSessionBtn" class="secondary">Refresh Session Status</button>
          <button id="logoutSessionBtn" class="secondary">Logout Facebook</button>
        </div>
      </section>
    </div>

    <section class="card" style="margin-top: 14px;">
      <h2>Create Filter</h2>
      <form id="filterForm" class="grid">
        <div>
          <label for="keyword">Keyword</label>
          <input id="keyword" required placeholder="honda civic" />
        </div>
        <div>
          <label for="location">Location (city)</label>
          <input id="location" required placeholder="toronto" />
        </div>
        <div>
          <label for="minPrice">Min Price</label>
          <input id="minPrice" type="number" min="0" />
        </div>
        <div>
          <label for="maxPrice">Max Price</label>
          <input id="maxPrice" type="number" min="0" />
        </div>
        <div style="grid-column: 1 / -1;">
          <button type="submit">Create Filter</button>
        </div>
      </form>
      <div id="filterNotice" class="notice"></div>
    </section>

    <section class="card" style="margin-top: 14px;">
      <div class="row" style="align-items: center;">
        <h2 style="margin: 0;">Manage Filters</h2>
        <button id="refreshFiltersBtn" class="secondary" style="max-width: 220px;">Refresh Filters</button>
      </div>
      <div class="table-wrap" style="margin-top: 12px;">
        <table>
          <thead>
            <tr>
              <th>Keyword</th>
              <th>Location</th>
              <th>Min</th>
              <th>Max</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="filterBody"></tbody>
        </table>
      </div>
      <div id="filterManageNotice" class="notice"></div>
    </section>

    <section class="card" style="margin-top: 14px;">
      <div class="row" style="align-items: center;">
        <h2 style="margin: 0;">Latest Listings</h2>
        <button id="refreshListingsBtn" class="secondary" style="max-width: 220px;">Refresh Listings</button>
      </div>
      <div class="table-wrap" style="margin-top: 12px;">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Price</th>
              <th>Location</th>
              <th>URL</th>
            </tr>
          </thead>
          <tbody id="listingBody"></tbody>
        </table>
      </div>
      <div id="listingNotice" class="notice"></div>
    </section>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
